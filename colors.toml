# Deus Vult Blue Phosphor: P11 blue phosphor on a dark CRT field (deusvult.digital).
# Background, foreground, accent and borders are the P11 ramp. The ANSI
# colours are the same in every Deus Vult phosphor (the site's other phosphors
# and a plain red), so errors, warnings and diffs still read as what they are.
# Generated by tools/build.py from phosphors.toml.

mode = "dark"

accent = "#60a5fa"
selection = "#1e40af"
muted = "#4f6387"

background = "#050912"
dark_background = "#03060c"
darker_background = "#010103"
lighter_background = "#0b1428"

foreground = "#bfdbfe"
dark_foreground = "#2563eb"
light_foreground = "#dbeafe"
bright_foreground = "#eff6ff"

hyprland_active_border = "rgba(93c5fdee) rgba(2563ebee) 45deg"
hyprland_inactive_border = "rgba(1e40afaa)"

red = "#f87171"
yellow = "#fbbf24"
orange = "#fb923c"
green = "#22c55e"
cyan = "#2dd4bf"
blue = "#60a5fa"
magenta = "#c084fc"
brown = "#b45309"

bright_red = "#fca5a5"
bright_yellow = "#fde68a"
bright_green = "#4ade80"
bright_cyan = "#5eead4"
bright_blue = "#93c5fd"
bright_magenta = "#d8b4fe"
